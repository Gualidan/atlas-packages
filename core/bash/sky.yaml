schema: 1
name: bash
version: 5.3.0
release: 1
architecture: x86_64

source:
  url: https://ftpmirror.gnu.org/bash/bash-5.3.tar.gz
  sha256: 0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba

prepare: |
  cd "$srcdir"
  ./configure --prefix=/usr


build: |
  cd "$srcdir"
  make

check: |
  cd "$srcdir"
  make test

package: |
  cd "$srcdir"
  make DESTDIR="$pkgdir" install
